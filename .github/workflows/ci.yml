name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]   # publishing a release on GitHub builds the downloads and attaches them

permissions:
  contents: write   # only used by the release job on version tags

jobs:
  build:
    name: Build + self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest,   rid: osx-arm64 }
          - { os: ubuntu-latest,  rid: linux-x64 }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Build
        run: dotnet build src/Shoebox -c Release
      - name: Self-test (GST math, categories, checks, CSV safety)
        run: dotnet run --project src/Shoebox -c Release --no-build -- selftest
      - name: Publish single-file app
        run: dotnet publish src/Shoebox -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o out/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: shoebox-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/shoebox*

  real-model:
    name: Read sample receipts with real Gemma 3 (local, via Ollama)
    if: github.event_name != 'release'
    needs: build
    runs-on: ubuntu-latest
    env:
      SHOEBOX_DATA: ${{ github.workspace }}/run-data
      MODEL: gemma3:4b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Install Ollama and pull Gemma 3 (4B, vision)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) || true
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "$MODEL"
      - name: Read the sample receipts (headless scan)
        run: dotnet run --project src/Shoebox -c Release -- scan "$GITHUB_WORKSPACE/samples/receipts" --model "$MODEL" --year 2026 --csv "$GITHUB_WORKSPACE/sample-export.csv"
      - name: Score against the known values
        if: always()
        run: |
          python3 samples/score.py "$SHOEBOX_DATA" | tee score.txt
          python3 samples/score.py "$SHOEBOX_DATA" --markdown >> "$GITHUB_STEP_SUMMARY"
          # Also publish results as annotations (max 10 per step), so they're readable via the GitHub API:
          # first the raw readings of receipts with any wrong field, then the accuracy line.
          python3 - "$SHOEBOX_DATA" <<'PY'
          import json, sys, os
          exp = {e["file"]: e for e in json.load(open("samples/expected.json"))}
          for r in json.load(open(os.path.join(sys.argv[1], "receipts.json"))):
              e, raw = exp.get(r["fileName"]), (r.get("raw") or {})
              if not e: continue
              wrong = [k for k, ek in [("subtotal","subtotal"),("gst","gst"),("total","total")] if abs(float(raw.get(k,0)) - e[ek]) > 0.005]
              if raw.get("date") != e["date"]: wrong.append("date")
              if r.get("category") != e["cat"]: wrong.append("category")
              if wrong:
                  print(f"::notice title=Misread {r['fileName']}::wrong={wrong} status={r['status']} raw={json.dumps(raw)} final_category={r.get('category')} checks={r.get('checks')} cautions={r.get('cautions')}")
          PY
          grep accuracy score.txt | sed 's/^/::notice title=Gemma 3 accuracy::/' 
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-model-run
          path: |
            run-data/receipts.json
            sample-export.csv

  release:
    name: Attach downloads to the GitHub release
    if: github.event_name == 'release'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - name: Zip each platform
        run: |
          cd dl
          for d in shoebox-*; do (cd "$d" && zip -q -9 "../$d.zip" shoebox*); done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dl/shoebox-*.zip
